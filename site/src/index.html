<style>
/* Layout: a full-bleed 3D stage (top on phones, left on desktop) beside an instrument panel of joint dials and a live length ledger */

  --muted: #56655f;
  --line: #c5cfca;
  --accent: #1c5d55;
  --accent-ink: #f3f8f6;
  /* length change is a diverging scale: red (shorter) <- neutral gray (unchanged) -> blue (longer) */
  --short: #e34948;
  --long: #2a78d6;
  --muscle: #a9a49e;
  --short-ink: #b8322f;   /* the same hues darkened for text, which needs 4.5:1 on the panel */
  --long-ink: #1f5fae;
  --tendon: #d6cdb9;
  --bone: #ece3cd;
  --stage: #dae2de;
  --f-display: "Spectral", "Noto Serif TC", Georgia, serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;

}
@media (prefers-color-scheme: dark) {

    --accent: #63b5a9; --accent-ink: #0c1311; --short: #e66767; --long: #3987e5; --muscle: #8f8a84; --short-ink: #ff8a7d; --long-ink: #7db3ff; --tendon: #b4ab98;
    --bone: #d7cdb6; --stage: #131917; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #161c1a; --surface-2: #1f2724; --ink: #e2eae6; --muted: #91a099; --line: #2b3531;
  --accent: #63b5a9; --accent-ink: #0c1311; --short: #e66767; --long: #3987e5; --muscle: #8f8a84; --short-ink: #ff8a7d; --long-ink: #7db3ff; --tendon: #b4ab98;

}

<script type="module">
import * as THREE from 'three';

const $ = (s) => document.querySelector(s);
const SEG_ZH = {

const VIEWS = {
  overview: { c: [0, 0.03, 0.9], r: 0.98, d: [-0.32, -1, 0.12] },
  arm: { c: [-0.21, 0.02, 1.1], r: 0.46, d: [-0.8, -1, 0.22] },

// ---------- three.js setup ----------
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 20);
camera.up.set(0, 0, 1);
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x7d837f, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(0.6, 0.9, 0.4);
camera.add(key); camera.add(key.target); key.target.position.set(0, 0, -1);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.minDistance = 0.25; controls.maxDistance = 6;

const C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['stage', 'bone', 'muscle', 'tendon', 'short', 'long', 'accent']) C[k] = new THREE.Color(cs.getPropertyValue('--' + k).trim());
  C.ctx = C.bone.clone().lerp(C.stage, 0.55);
  C.hot = C.bone.clone().lerp(C.accent, 0.3);
  renderer.setClearColor(C.stage);
}
readColors();

const boneMat = new THREE.MeshStandardMaterial({ roughness: 0.75, metalness: 0 });
const ctxMat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0 });
const hotMat = { arm: new THREE.MeshStandardMaterial({ roughness: 0.7 }), leg: new THREE.MeshStandardMaterial({ roughness: 0.7 }) };
function paintStatic() {
  boneMat.color.copy(C.bone);
  ctxMat.color.copy(state.region ? C.ctx : C.bone);
  for (const r of ['arm', 'leg']) hotMat[r].color.copy(state.hover === r ? C.bone.clone().lerp(C.accent, 0.55) : C.hot);
}

let needsRender = true;
const requestRender = () => { needsRender = true; };
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  requestRender();
}
new ResizeObserver(resize).observe($('#stage'));

// camera framing: fit a sphere (centre, radius) seen from direction d
function viewFor(name) {
  const v = VIEWS[name];
  const vf = (camera.fov * Math.PI) / 360;
  const hf = Math.atan(Math.tan(vf) * camera.aspect);
  const dist = v.r / Math.sin(Math.min(vf, hf));
  const d = new THREE.Vector3(...v.d).normalize();
  const c = new THREE.Vector3(...v.c);
  return { target: c, pos: c.clone().addScaledVector(d, dist) };
}
let camTween = null;
// keep the moving limb in frame: the target follows the limb's landmarks, distance fits their spread
const follow = { on: false, target: new THREE.Vector3(), dist: 1, zoom: 1, user: false, lock: false };
function fitDist(radius) {
  const vf = (camera.fov * Math.PI) / 360, hf = Math.atan(Math.tan(vf) * camera.aspect);
  return radius / Math.sin(Math.min(vf, hf));
}
function updateFollow(M) {
  const pts = model.regions[state.region].landmarks.map((l) => apply(M[l.seg], l.p));
  const lo = [0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), hi = [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i])));
  const c = lo.map((v, i) => (v + hi[i]) / 2);
  const r = Math.max(...pts.map((p) => Math.hypot(p[0] - c[0], p[1] - c[1], p[2] - c[2]))) + 0.1;
  follow.target.set(c[0], c[1], c[2]);
  follow.dist = fitDist(r);
  follow.on = true;
}
controls.addEventListener('start', () => { follow.user = true; });
controls.addEventListener('end', () => {

});
function flyTo(name) {

// ---------- state ----------
const state = { region: null, ang: {}, L0: {}, L: {}, strain: {}, selected: null, picked: null, group: 'all', onlyChanged: false, ghost: false, hideMuscles: false, hover: null, play: null, tween: null, gaitPhase: 0,
  left: { on: false, ang: {}, strain: {} } };   // the mirrored left leg, shown only while walking
let model, overview, R;
const regionCache = {};
const loader = new GLTFLoader();
// The small model copies need the meshopt WebAssembly decoder; if WebAssembly is unavailable
// the page falls back to larger plain copies.
let compressed = null;
async function useCompressed() {
  if (compressed === null) {
    try {
      const { MeshoptDecoder } = await import('three/addons/libs/meshopt_decoder.module.js');
      await MeshoptDecoder.ready;
      loader.setMeshoptDecoder(MeshoptDecoder);
      compressed = true;
    } catch (err) {
      console.warn('meshopt decoder unavailable, loading uncompressed models', err);
      compressed = false;
    }
  }
  return compressed;
}
// 'glb': plain static hosting serves the .glb files directly.
// 'b64': the Claude Artifact host only serves text, so models ship as base64 and are decoded here.
const ASSET_MODE = '__ASSET_MODE__';
async function fetchBuf(name) {
  const file = name + (ASSET_MODE === 'b64' ? '.b64.txt' : '.glb');
  const res = await fetch(file);
  if (!res.ok) throw new Error(`${file} 下載失敗（${res.status}）`);
  if (ASSET_MODE !== 'b64') return res.arrayBuffer();
  const bin = atob((await res.text()).trim());
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u.buffer;
}
async function loadGLB(name) {
  if (await useCompressed()) {
    try { return await loader.parseAsync(await fetchBuf(name), ''); }
    catch (err) { console.warn('compressed model failed, trying plain copy', err); }
  }
  return loader.parseAsync(await fetchBuf(name + '.plain'), '');
}

// ---------- loading ----------
async function boot() {
  model = await (await fetch('model.json')).json();
  for (const r of ['arm', 'leg']) {
    const n = Object.values(model.regions[r].muscles).filter((m) => m.kind === 'muscle').length;
    $(`#${r}-sum`).textContent = `${r === 'arm' ? '肩、肘、前臂、手腕' : '髖、膝、踝、腳趾'} · ${model.rig.regions[r].dofs.length} 個角度 · ${n} 條肌肉`;
  }
  const g = await loadGLB('overview');
  overview = { root: g.scene, parts: {} };
  g.scene.traverse((o) => {
    if (o.isMesh && o.userData.part) {
      overview.parts[o.userData.part] = o;
      o.material = hotMat[o.userData.part] ?? ctxMat;     // context and the static left leg share the context look
    }
  });
  scene.add(g.scene);
  paintStatic();
  $('#loading').hidden = true;
  resize();
  const v = viewFor('overview'); camera.position.copy(v.pos); controls.target.copy(v.target);
  const start = location.hash.slice(1);
  if (start === 'arm' || start === 'leg') enterRegion(start);
  requestRender();
}

async function loadRegion(r) {
  if (regionCache[r]) return regionCache[r];
  const g = await loadGLB(`region_${r}`);
  const reg = { root: g.scene, segs: {}, muscles: {}, bones: {} };
  g.scene.traverse((o) => {
    if (o.userData.seg) { reg.segs[o.userData.seg] = o; o.matrixAutoUpdate = false; }
    if (o.isMesh && o.userData.bone) { o.material = boneMat; reg.bones[o.userData.bone] = o; }
    if (o.isMesh && o.userData.muscle) {
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0 });
      o.material = mat; o.frustumCulled = false;
      reg.muscles[o.userData.muscle] = { mesh: o, mat, meta: model.regions[r].muscles[o.userData.muscle] };
    }
  });
  const M = fk(model.rig, r, {});
  reg.L0 = {};
  for (const [n, m] of Object.entries(reg.muscles)) if (measurable(m.meta)) reg.L0[n] = muscleLength(m.meta, M, {});
  regionCache[r] = reg;
  return reg;
}

// The left leg: the right leg mirrored in x = 0 (exact, the source model is symmetric), loaded on first walk.
let LEFT = null, leftLoading = null;
function loadLeft() {
  if (LEFT) return Promise.resolve(LEFT);
  if (!leftLoading) leftLoading = loadGLB(model.regions.leg.left.file).then((g) => {
    const L = { root: g.scene, segs: {}, muscles: {} };
    g.scene.traverse((o) => {
      if (o.userData.seg) { L.segs[o.userData.seg] = o; o.matrixAutoUpdate = false; }
      if (o.isMesh && o.userData.bone) o.material = boneMat;
      if (o.isMesh && o.userData.muscle) {
        const mat = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0 });
        o.material = mat; o.frustumCulled = false;
        L.muscles[o.userData.muscle] = { mesh: o, mat, meta: model.regions.leg.muscles[o.userData.muscle] };
      }
    });
    g.scene.visible = false;
    scene.add(g.scene);
    LEFT = L;
    return L;
  });
  return leftLoading;
}
function setLeft(on) {
  on = on && state.region === 'leg' && !!LEFT;
  state.left.on = on;
  if (LEFT) LEFT.root.visible = on;
  if (overview) overview.parts.leg_l.visible = !on;
  $('#gait-phase-l').hidden = !on;
}

// ---------- region view ----------
async function enterRegion(r) {
  $('#loading').textContent = '載入肌肉…'; $('#loading').hidden = false;
  state.region = r;
  paintStatic(); requestRender();
  const reg = await loadRegion(r);
  if (state.region !== r) return;
  $('#loading').hidden = true;
  R = reg;
  for (const k of Object.keys(regionCache)) regionCache[k].root.visible = k === r;
  if (!reg.root.parent) scene.add(reg.root);
  overview.parts.arm.visible = r !== 'arm';
  overview.parts.leg.visible = r !== 'leg';
  overview.parts.arm.material = r === 'arm' ? hotMat.arm : ctxMat;
  overview.parts.leg.material = r === 'leg' ? hotMat.leg : ctxMat;
  state.ang = Object.fromEntries(model.rig.regions[r].dofs.map((d) => [d.id, 0]));
  state.selected = null; state.picked = null; state.group = 'all'; state.lastPreset = null;
  buildRegionUI(r);
  $('#home').hidden = true; $('#region').hidden = false; $('#back').hidden = false; $('#legend').hidden = false;
  document.body.classList.add('in-region');
  $('#eyebrow').textContent = '右側 · ' + (r === 'arm' ? '上肢' : '下肢');
  $('#title').innerHTML = `<span class="zh-t">${r === 'arm' ? '手臂與肩胛骨' : '單腳到腳掌'}</span>`;
  $('#lede').textContent = '拖動角度或點動作範例。紅色的肌肉起止點在靠近（縮短），藍色的在拉開（拉長）。點肌肉看名稱。';
  paintStatic();
  follow.zoom = 1; follow.on = false; follow.lock = false; state.gaitPhase = 0;
  updatePose();
  const v0 = VIEWS[r];
  VIEWS[r] = { ...v0, c: follow.target.toArray(), r: Math.max(v0.r, follow.dist * Math.sin(Math.min((camera.fov * Math.PI) / 360, Math.atan(Math.tan((camera.fov * Math.PI) / 360) * camera.aspect)))) };
  flyTo(r);
  VIEWS[r] = v0;
  try { history.replaceState(null, '', '#' + r); } catch (e) {}
}

function leaveRegion() {
  stopPlay();
  setLeft(false);
  follow.on = false; follow.lock = false;
  state.region = null; R = null; state.selected = null; state.picked = null;
  for (const k of Object.keys(regionCache)) regionCache[k].root.visible = false;
  overview.parts.arm.visible = overview.parts.leg.visible = true;
  overview.parts.arm.material = hotMat.arm; overview.parts.leg.material = hotMat.leg;
  document.body.classList.remove('in-region');
  $('#home').hidden = false; $('#region').hidden = true; $('#back').hidden = true; $('#legend').hidden = true; $('#ledger').hidden = true; $('#pick').hidden = true;
  $('#eyebrow').textContent = '右側肢體 · 3D';
  $('#title').innerHTML = '<span class="zh-t">肌骨動作圖譜</span>';
  $('#lede').textContent = '轉動關節，看哪些肌肉的起止點靠近、哪些被拉開。點選手臂或腿進入那個部位。';
  paintStatic(); flyTo('overview');
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}

const m4 = new THREE.Matrix4();
function updatePose() {
  if (!R) return;
  const r = state.region;
  const M = fk(model.rig, r, state.ang);
  for (const [seg, node] of Object.entries(R.segs)) {
    const a = M[seg];
    node.matrix.set(a[0], a[1], a[2], a[3], a[4], a[5], a[6], a[7], a[8], a[9], a[10], a[11], a[12], a[13], a[14], a[15]);
    node.matrixWorldNeedsUpdate = true;
  }
  for (const n of Object.keys(R.L0)) {
    const L = muscleLength(R.muscles[n].meta, M, state.ang);
    state.L[n] = L; state.strain[n] = L / R.L0[n] - 1;
  }
  if (state.left.on) {
    // lengths do not change under a mirror, so the right-leg FK at the left leg's angles gives its lengths
    const Ml = fk(model.rig, 'leg', state.left.ang), Mm = mirrorX(Ml);
    for (const [seg, node] of Object.entries(LEFT.segs)) {
      const a = Mm[seg];
      node.matrix.set(a[0], a[1], a[2], a[3], a[4], a[5], a[6], a[7], a[8], a[9], a[10], a[11], a[12], a[13], a[14], a[15]);
      node.matrixWorldNeedsUpdate = true;
    }
    for (const n of Object.keys(R.L0)) state.left.strain[n] = muscleLength(R.muscles[n].meta, Ml, state.left.ang) / R.L0[n] - 1;
  }
  if (!follow.lock) updateFollow(M);
  paintMuscles();
  scheduleUI();
  requestRender();
}

const tmp = new THREE.Color();
function muscleColor(n, out, strain = state.strain) {
  const m = R.muscles[n].meta;
  if (m.kind === 'tendon') out.copy(C.tendon);
  else {
    out.copy(C.muscle);
    const s = strain[n] ?? 0;
    // full colour at ±15 %; the square root lifts small changes (walking is mostly 2-9 %) so they still read
    if (Math.abs(s) > 0.005) out.lerp(s < 0 ? C.short : C.long, Math.sqrt(Math.min(1, Math.abs(s) / 0.15)));
  }
  return out;
}
function isVisible(n, strain = state.strain) {
  if (state.hideMuscles) return false;
  const m = R.muscles[n].meta;
  if (state.group !== 'all' && m.group !== state.group) return false;
  if (state.onlyChanged && !(Math.abs(strain[n] ?? 0) > 0.01) && state.selected !== n) return false;
  return true;
}
function paintMuscles() {
  paintSet(R.muscles, state.strain);
  if (state.left.on) paintSet(LEFT.muscles, state.left.strain);
}
function paintSet(muscles, strain) {
  for (const [n, m] of Object.entries(muscles)) {
    muscleColor(n, m.mat.color, strain);
    m.mat.emissive.setRGB(0, 0, 0);
    const other = state.selected && state.selected !== n;
    if (state.selected === n) m.mat.emissive.copy(m.mat.color).multiplyScalar(0.25);
    // a selected muscle is often deep; fade the rest so it stays visible
    const ghost = state.ghost || other;
    m.mat.transparent = ghost; m.mat.opacity = other ? 0.14 : ghost ? 0.28 : 1; m.mat.depthWrite = !ghost;
    m.mesh.renderOrder = state.selected === n ? 1 : 0;
    m.mesh.visible = isVisible(n, strain);
  }
}

// ---------- UI ----------
let uiQueued = false;
function scheduleUI() { if (!uiQueued) { uiQueued = true; requestAnimationFrame(() => { uiQueued = false; renderUI(); }); } }
const fmtPct = (s) => (s < 0 ? '−' : '+') + Math.abs(s * 100).toFixed(Math.abs(s) < 0.1 ? 1 : 0) + '%';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function renderUI() {
  if (!R) return;
  // sliders' read-outs
  for (const d of model.rig.regions[state.region].dofs) {
    const el = document.getElementById('dof-' + d.id);
    if (el && Number(el.value) !== Math.round(state.ang[d.id])) el.value = Math.round(state.ang[d.id]);
    const out = document.getElementById('out-' + d.id);
    if (out) out.textContent = `${Math.round(state.ang[d.id])}°`;
  }
  // stage ledger: top changes
  const items = Object.keys(R.L0).map((n) => [n, state.strain[n]]).filter(([, s]) => Math.abs(s) > 0.01);
  const sh = items.filter(([, s]) => s < 0).sort((a, b) => a[1] - b[1]).slice(0, 3);
  const lo = items.filter(([, s]) => s > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const col = (title, cls, arr) => arr.length ? `<div class="lg-col"><div class="lg-head"><i style="background:var(--${cls === 's' ? 'short' : 'long'})"></i>${title}</div>${arr.map(([n, s]) =>
    `<button class="lg-row" data-m="${esc(n)}"><span>${esc(R.muscles[n].meta.zh)}</span><span class="delta ${cls} num">${fmtPct(s)}</span></button>`).join('')}</div>` : '';
  const side = state.left.on ? '右腳 ' : '';
  $('#ledger').innerHTML = col(side + '縮短最多', 's', sh) + col(side + '拉長最多', 'l', lo);
  $('#ledger').hidden = !(sh.length || lo.length);
  // full list
  if (!$('#pane-muscles').hidden) renderList();
  renderPick();
}

function pathText(m) {
  const out = [];
  for (const a of m.anchors) {
    const label = a.role === 'end' ? SEG_ZH[a.seg] : `（經${VIA_ZH[a.role] || '關節'}）`;
    if (out[out.length - 1] !== label) out.push(label);
  }
  return out.join(' → ').replace(/ → （/g, ' （').replace(/） → /g, '） → ');
}

function renderPick() {
  const el = $('#pick');
  if (state.selected) {
    const n = state.selected, mm = R.muscles[n], m = mm.meta;
    const g = model.regions[state.region].groups.find((x) => x.id === m.group);
    let change = '';
    if (m.kind === 'tendon') change = '<span class="meta">肌腱（不計長度變化）</span>';
    else if (R.L0[n] !== undefined) {
      const s = state.strain[n];
      change = `<span class="delta ${s < -0.005 ? 's' : s > 0.005 ? 'l' : ''} num">${Math.abs(s) < 0.005 ? '±0%' : fmtPct(s)}</span>`;
    } else change = '<span class="meta">長度不變</span>';
    const len = R.L0[n] !== undefined ? `附著點路徑 <span class="num">${(state.L[n] * 100).toFixed(1)}</span> cm（解剖姿勢 <span class="num">${(R.L0[n] * 100).toFixed(1)}</span> cm）` : '兩端在同一組骨頭上，這個模型裡長度不會變（手指、腳趾內部的關節沒有做）。';
    el.innerHTML = `<div class="card" role="status">
      <div class="t"><span class="zh">${esc(m.zh)}</span><span class="row">${change}<button class="x" id="unpick" aria-label="取消選取">×</button></span></div>
      <div class="la">${esc(m.name)}</div>
      <div class="meta">${esc(g ? g.label : '')} · ${esc(pathText(m))}</div>
      <div class="meta">${len}</div>
      ${m.renamed ? `<div class="meta">原模型標為「${esc(m.source_name)}」，位置判斷是標反了，這裡已改正。</div>` : ''}
    </div>`;
    el.hidden = false; $('#legend').hidden = true;
  } else if (state.picked) {
    const b = state.picked;
    el.innerHTML = `<div class="card" role="status"><div class="t"><span class="zh">${esc(R.bones[b] ? model.regions[state.region].bones[b].zh : b)}</span><button class="x" id="unpick" aria-label="關閉">×</button></div>
      <div class="la">${esc(b.replace(/\.r$/, ''))}</div><div class="meta">骨頭 · 屬於「${esc(SEG_ZH[model.regions[state.region].bones[b].seg])}」這一段</div></div>`;
    el.hidden = false; $('#legend').hidden = true;
  } else { el.hidden = true; $('#legend').hidden = !state.region; }
}

function renderList() {
  const reg = model.regions[state.region];
  const groups = reg.groups.filter((g) => state.group === 'all' || g.id === state.group);
  let html = '';
  for (const g of groups) {
    const ms = Object.entries(R.muscles).filter(([, m]) => m.meta.group === g.id);
    if (!ms.length) continue;
    html += `<div class="gtitle">${esc(g.label)}</div>`;
    for (const [n, m] of ms) {
      const s = state.strain[n];
      const val = m.meta.kind === 'tendon' ? '肌腱' : s === undefined ? '—' : Math.abs(s) < 0.005 ? '±0%' : fmtPct(s);
      const col = '#' + muscleColor(n, tmp).getHexString(THREE.SRGBColorSpace);
      html += `<button class="mrow" data-m="${esc(n)}" aria-current="${state.selected === n}"><span class="sw" style="background:${col}"></span>
        <span class="nm"><span>${esc(m.meta.zh)}</span><small>${esc(m.meta.name)}</small></span><span class="delta num ${s < -0.005 ? 's' : s > 0.005 ? 'l' : ''}">${val}</span></button>`;
    }

}

function aboutHTML(r) {

    ? '肩胛骨和鎖骨不能單獨控制：手臂每抬高 3 度，肩胛骨跟著上轉約 1 度（教科書的 2:1 肩肱節律）。手腕屈伸由兩排腕骨各分擔一半。手指固定不動。'

    <div><h3>變短不一定是在出力</h3><p>這裡顯示的是幾何上的長度變化。實際是誰在出力，還要看動作方向和重力。例如手臂慢慢放下時，三角肌在變長，但它正在出力控制下降速度（離心收縮）。</p></div>
    <div><h3>長度怎麼量</h3><p>沿著肌肉的附著點連線量，遇到肌腱繞過關節的地方會加一個滑車點（例如內外踝後方、膝蓋後方、腕部），所以量到的是肌肉加肌腱的路徑長，不是變形後的網格長度。肱二頭肌的肌腱在旋前時會繞著橈骨捲，這部分另外加上。</p></div>
    <div><h3>簡化之處</h3><p>${sim} 骨頭的形狀和肌肉位置來自模型，但動作是用固定的關節軸近似，極端角度時骨頭可能有幾毫米的重疊或間隙。</p></div>
    ${r === 'leg' ? `<div><h3>走路</h3><p>走路的關節角度是健康成人正常速度的典型曲線：依步態講義的各期數值（腳跟著地時髖屈曲 30°、膝 5°；擺盪初期末膝屈曲約 60°；站立末期踝背屈、離地前蹠屈約 20°），用不會過衝的方式平滑連接。只做前後方向的動作，骨盆固定，所以看起來像懸空擺腿。</p><p>走路時兩腳都會動：左腳是右腳的鏡像，相差半個週期（右腳跟著地時，左腳正要離地）。原始模型左右完全對稱，所以鏡像出來的就是模型本身的左腳。名稱卡、肌肉清單和右上角的排行都是右腳的數值。</p><p>走路特別要記得長度不等於出力：腳跟著地後，脛前肌正在出力讓腳掌慢慢放下，但它同時被拉長，所以是藍色；站立中期的比目魚肌也是一邊出力、一邊被拉長。</p></div>` : ''}
    <div><h3>怎麼驗證過</h3><p>每個關節動作都對照了教科書的主動肌與拮抗肌，例如屈肘 90° 時，肱肌縮短 25%、肱三頭肌內側頭拉長 19%。走路則檢查每條主要肌肉在週期的哪個時間點最長，例如膕旁肌在擺盪末期、髂腰肌在站立末期。兩個部位共 125 項預期全部符合。骨頭的轉動方向也是用量測確認，不是看圖判斷。</p></div>
    <div><h3>原模型的錯誤</h3><p>原模型把斜方肌上束和下束的名稱標反了（標「上行部」的那塊其實在脖子上），這裡依位置改正。另外有些肌肉的附著點沒有標，或者標在它只是貼著、並沒有附著的骨頭上，例如股直肌被標到股骨上，這些都依解剖學調整過。</p></div>
    <div><p class="muted">模型：<a href="https://github.com/LluisV/Z-Anatomy" target="_blank" rel="noopener">Z-Anatomy</a>（衍生自 BodyParts3D），授權 CC BY-SA 4.0。只有右側肢體可以動。</p></div>`;
}

function selectTab(id) {
  for (const t of ['move', 'muscles', 'about']) {
    $('#tab-' + t).setAttribute('aria-selected', String(t === id));
    $('#pane-' + t).hidden = t !== id;
  }
  if (id === 'muscles') renderList();
}
function markPreset(i) {
  document.querySelectorAll('#presets .chip').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.p) === i)));
  const g = isGait(i);
  $('#gait').hidden = !g;
  if (!state.play) $('#play').textContent = g ? '播放' : '來回播放';
  if (!g) { follow.lock = false; if (state.left.on) { setLeft(false); scheduleUI(); } }
}

// ---------- motion ----------
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function tweenTo(target, dur = 900, onDone) {
  const from = { ...state.ang };
  const to = Object.fromEntries(Object.keys(state.ang).map((k) => [k, target[k] ?? 0]));
  if (reduceMotion) { state.ang = to; updatePose(); onDone && onDone(); return; }
  state.tween = { t0: performance.now(), dur, from, to, onDone };
}
const playLabel = () => (isGait(state.lastPreset) ? '播放' : '來回播放');   // walking loops, presets go back and forth
function stopPlay() {
  state.play = null;
  $('#play').setAttribute('aria-pressed', 'false'); $('#play').textContent = playLabel();
}
const atPose = (target) => Object.keys(state.ang).every((k) => Math.abs((target[k] ?? 0) - state.ang[k]) < 0.5);
// ---- walking: loop through the gait cycle (model.regions.leg.gait) ----
const GAIT_PERIOD = 4000;   // ms per cycle, slow motion
const isGait = (i) => i != null && PRESETS[state.region]?.[i]?.[1] === 'gait';
function gaitPose(phase) {
  return { ...Object.fromEntries(Object.keys(state.ang).map((k) => [k, 0])), ...gaitAngles(model.regions.leg.gait, phase) };
}
function setGaitPhase(phase) {
  state.gaitPhase = ((phase % 1) + 1) % 1;
  state.ang = gaitPose(state.gaitPhase);
  state.left.ang = gaitPose(state.gaitPhase + model.regions.leg.left.phase_offset);
  updatePose();
  renderGait();
}
function phaseAt(pct) {
  const g = model.regions.leg.gait;
  const ph = g.phases.find((p) => pct >= p.start && pct < p.end) ?? g.phases[g.phases.length - 1];
  return `${ph.zh}（${pct < g.stance_pct ? '站立期' : '擺盪期'}）`;
}
function renderGait() {
  const pct = state.gaitPhase * 100;
  const pctL = ((state.gaitPhase + model.regions.leg.left.phase_offset) % 1) * 100;
  $('#gait-phase').textContent = (state.left.on ? '右腳：' : '') + phaseAt(pct);
  $('#gait-phase-l').textContent = `左腳：${phaseAt(pctL)}，${Math.floor(pctL)}%`;
  $('#gait-pct').textContent = `${Math.floor(pct)}%`;
  $('#gait-scrub').value = pct.toFixed(1);
}
// frame every pose of the cycle once, seen from the side, and hold the camera there while walking
function frameGait() {
  const g = model.regions.leg.gait, pts = [], off = model.regions.leg.left.phase_offset;
  for (let i = 0; i < g.n; i += 5) {
    const M = fk(model.rig, 'leg', gaitPose(i / g.n)), Ml = mirrorX(fk(model.rig, 'leg', gaitPose(i / g.n + off)));
    for (const l of model.regions.leg.landmarks) {
      pts.push(apply(M[l.seg], l.p));
      pts.push(apply(Ml[l.seg], [-l.p[0], l.p[1], l.p[2]]));
    }
  }
  const lo = [0, 1, 2].map((k) => Math.min(...pts.map((p) => p[k]))), hi = [0, 1, 2].map((k) => Math.max(...pts.map((p) => p[k])));
  const c = lo.map((v, k) => (v + hi[k]) / 2);
  const r = Math.max(...pts.map((p) => Math.hypot(p[0] - c[0], p[1] - c[1], p[2] - c[2]))) + 0.1;
  follow.target.set(c[0], c[1], c[2]); follow.dist = fitDist(r); follow.zoom = 1; follow.on = true; follow.lock = true;
  VIEWS.gait = { c, r, d: [-1, -0.6, 0.15] };   // front-right, so the left leg is not hidden behind the right
  flyTo('gait');
}
function startGait(fromPhase, fly) {
  const idx = PRESETS[state.region].findIndex((p) => p[1] === 'gait');
  state.lastPreset = idx; markPreset(idx);
  if (!state.left.on) {
    if (!LEFT) { $('#loading').textContent = '載入左腳…'; $('#loading').hidden = false; }
    loadLeft().then(() => {
      $('#loading').hidden = true;
      if (state.region !== 'leg' || !isGait(state.lastPreset)) return;
      state.left.ang = gaitPose(state.gaitPhase + model.regions.leg.left.phase_offset);
      setLeft(true); updatePose(); renderGait();
    }).catch((err) => { console.error(err); $('#loading').textContent = '左腳載入失敗，先只顯示右腳。'; });
  }
  if (fly) frameGait(); else follow.lock = true;
  const run = { gait: true, ready: false, phase0: fromPhase };
  state.play = run;
  $('#play').setAttribute('aria-pressed', 'true'); $('#play').textContent = '停止播放';
  state.gaitPhase = fromPhase; renderGait();
  const go = () => { if (state.play !== run) return; run.t0 = performance.now(); run.ready = true; };
  const start = gaitPose(fromPhase);
  if (atPose(start)) { state.tween = null; go(); } else tweenTo(start, 700, go);
}

// Ping-pong between a preset and the anatomical position.
// Each run is its own object: a step queued by an earlier run sees it is no longer current and stops.
function startPlay(idx = state.lastPreset ?? 0) {
  if (isGait(idx)) { startGait(state.gaitPhase ?? 0, false); return; }
  const target = PRESETS[state.region][idx][1];
  state.lastPreset = idx; markPreset(idx);
  // already standing in the preset pose: start by going back, otherwise the first leg would not move
  const run = { target, toward: atPose(target) ? 'rest' : 'target' };
  state.play = run;
  $('#play').setAttribute('aria-pressed', 'true'); $('#play').textContent = '停止播放';
  const step = () => {
    if (state.play !== run) return;
    const go = run.toward === 'target' ? run.target : {};
    run.toward = run.toward === 'target' ? 'rest' : 'target';
    tweenTo(go, 1500, () => setTimeout(step, 250));
  };
  step();
}

// ---------- picking ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const quick = performance.now() - down.t < 600;
  down = null;
  if (moved > 6 || !quick) return;
  const hit = pick(e);
  if (!state.region) {
    const r = hit && (hit.object.userData.part === 'arm' || hit.object.userData.part === 'leg') ? hit.object.userData.part : nearLimb();
    if (r) enterRegion(r);
    return;
  }
  if (hit && hit.object.userData.muscle) { state.selected = hit.object.userData.muscle; state.picked = null; }
  else if (hit && hit.object.userData.bone) { state.picked = hit.object.userData.bone; state.selected = null; }
  else { state.selected = null; state.picked = null; }
  paintMuscles(); scheduleUI(); requestRender();
});
canvas.addEventListener('pointermove', (e) => {
  if (state.region || e.pointerType !== 'mouse' || !overview) return;
  const hit = pick(e);
  const h = hit && (hit.object.userData.part === 'arm' || hit.object.userData.part === 'leg') ? hit.object.userData.part : nearLimb();
  if (h !== state.hover) { state.hover = h; canvas.style.cursor = h ? 'pointer' : ''; paintStatic(); requestRender(); }
});
// bones are thin on a phone screen: a tap within a few centimetres of the limb's axis also counts
function nearLimb() {
  let best = null, bestD = 0.07;
  for (const r of ['arm', 'leg']) {
    const pts = model.regions[r].landmarks.filter((l) => l.seg !== 'trunk').map((l) => new THREE.Vector3(...l.p));
    for (let i = 0; i + 1 < pts.length; i++) {
      const d = Math.sqrt(ray.ray.distanceSqToSegment(pts[i], pts[i + 1]));
      if (d < bestD) { bestD = d; best = r; }
    }
  }
  return best;
}
function pick(e) {
  const rect = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  scene.updateMatrixWorld();
  ray.setFromCamera(ndc, camera);
  const targets = [];
  if (!state.region) { targets.push(overview.parts.arm, overview.parts.leg); if (e.type !== 'pointermove') targets.push(overview.parts.context, overview.parts.leg_l); }
  else {
    for (const m of Object.values(R.muscles)) if (m.mesh.visible && !state.ghost) { m.mesh.boundingSphere = null; m.mesh.boundingBox = null; targets.push(m.mesh); }
    targets.push(...Object.values(R.bones));
  }
  const hits = ray.intersectObjects(targets, false);
  return hits[0] || null;
}

// ---------- events ----------
document.querySelectorAll('.region-btn').forEach((b) => b.addEventListener('click', () => enterRegion(b.dataset.region)));
$('#back').addEventListener('click', leaveRegion);
$('#tab-move').addEventListener('click', () => selectTab('move'));
$('#tab-muscles').addEventListener('click', () => selectTab('muscles'));
$('#tab-about').addEventListener('click', () => selectTab('about'));
$('#presets').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  const i = Number(b.dataset.p);
  if (isGait(i)) { startGait(0, true); return; }   // walking always plays, from heel strike
  if (state.play) { startPlay(i); return; }      // keep playing, now with the chosen movement
  state.lastPreset = i; markPreset(i);
  tweenTo(PRESETS[state.region][i][1]);
});
$('#play').addEventListener('click', () => (state.play ? stopPlay() : startPlay()));
$('#gait-scrub').addEventListener('input', (e) => { stopPlay(); state.tween = null; setGaitPhase(Number(e.target.value) / 100); });
$('#reset').addEventListener('click', () => { stopPlay(); markPreset(null); tweenTo({}); });
$('#groups').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.group = b.dataset.g;
  document.querySelectorAll('#groups .chip').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  paintMuscles(); renderList(); requestRender();
});
const onSelect = (e) => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  state.selected = state.selected === b.dataset.m ? null : b.dataset.m; state.picked = null;
  paintMuscles(); scheduleUI(); requestRender();
};
$('#mlist').addEventListener('click', onSelect);
$('#ledger').addEventListener('click', onSelect);
$('#pick').addEventListener('click', (e) => { if (e.target.closest('#unpick')) { state.selected = null; state.picked = null; paintMuscles(); scheduleUI(); requestRender(); } });
$('#opt-changed').addEventListener('change', (e) => { state.onlyChanged = e.target.checked; paintMuscles(); requestRender(); });
$('#opt-ghost').addEventListener('change', (e) => { state.ghost = e.target.checked; paintMuscles(); requestRender(); });
$('#opt-hide').addEventListener('change', (e) => { state.hideMuscles = e.target.checked; paintMuscles(); requestRender(); });
const retheme = () => { readColors(); paintStatic(); if (R) { paintMuscles(); scheduleUI(); } requestRender(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- loop ----------
renderer.setAnimationLoop((now) => {
  if (camTween) {
    const t = Math.min(1, (now - camTween.t0) / camTween.dur), k = ease(t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, k);
    controls.target.lerpVectors(camTween.q0, camTween.q1, k);
    if (t >= 1) camTween = null;
    needsRender = true;
  }
  if (state.tween) {
    const tw = state.tween, t = Math.min(1, (now - tw.t0) / tw.dur), k = ease(t);
    for (const id of Object.keys(tw.to)) state.ang[id] = tw.from[id] + (tw.to[id] - tw.from[id]) * k;
    updatePose();
    if (t >= 1) { state.tween = null; tw.onDone && tw.onDone(); }
  }
  if (state.play && state.play.gait && state.play.ready && !state.tween) {
    setGaitPhase(state.play.phase0 + (now - state.play.t0) / GAIT_PERIOD);
  }
  if (follow.on && state.region && !camTween && !follow.user) {
    const off = camera.position.clone().sub(controls.target);
    const d0 = off.length(), d1 = d0 + (follow.dist * follow.zoom - d0) * 0.12;
    const moved = controls.target.distanceTo(follow.target);
    if (moved > 1e-4 || Math.abs(d1 - d0) > 1e-4) {
      controls.target.lerp(follow.target, 0.12);
      camera.position.copy(controls.target).add(off.setLength(d1));
      needsRender = true;
    }
  }
  if (controls.update()) needsRender = true;
  if (needsRender) { needsRender = false; renderer.render(scene, camera); }
});

boot().catch((err) => {
  console.error(err);
  $('#loading').hidden = false;
  $('#loading').textContent = '模型載入失敗：' + err.message + '。重新整理頁面再試一次。';
});
</script>
